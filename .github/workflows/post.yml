name: Auto RSS Poster

on:
  repository_dispatch:
    types: [trigger-cron] # cron-job.org থেকে পাঠানো রিকোয়েস্ট ক্যাচ করবে
  schedule:
    # ব্যাকআপ হিসেবে গিটহাবের নিজস্ব ক্রন রাখা হলো
    - cron: '*/5 * * * *'
  workflow_dispatch: # ম্যানুয়ালি রান টেস্ট করার জন্য

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write # গিটহাবে ফাইল কমিট করার পারমিশন
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node index.js

      - name: Save last post data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/last_post.json
          git commit -m "chore: update last posted data [skip ci]" || exit 0
          git push
